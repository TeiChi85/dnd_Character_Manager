name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
        node-version: ['22']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install backend requirements
        run: python -m pip install -r server/requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s server -t . -v
      - name: Run rules core unit tests
        run: node tools/validate_rules_core.mjs
      - name: Run rules engine unit tests
        run: node tools/validate_rules_engine.mjs
      - name: Run synthetic rules adapter tests
        run: node tools/validate_rules_adapters.mjs
      - name: Run frontend integration tests
        run: node tools/validate_server_frontend.mjs
      - name: Run class-loading regression tests
        run: node tools/validate_class_loading.mjs
      - name: Run theme tests
        run: node tools/validate_theme.mjs
      - name: Verify portable rules harness without private rule data
        run: node tools/validate_rules.mjs --self-test
