name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned development linters
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          python -m pip install -r requirements-lint.txt
      - name: Lint maintained sources
        run: npm run --silent lint
      - name: Verify linter configuration with synthetic errors
        run: node tools/validate_lint.mjs

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
        node-version: ['22']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install backend requirements
        run: python -m pip install -r server/requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s server -t . -v
      - name: Run rules core unit tests
        run: node tools/validate_rules_core.mjs
      - name: Test character state and serialization
        run: node tools/validate_character_state.mjs
      - name: Test UI components
        run: node tools/validate_ui_components.mjs
      - name: Test mobile UI state and navigation
        run: node tools/validate_mobile_ui.mjs
      - name: Run rules engine unit tests
        run: node tools/validate_rules_engine.mjs
      - name: Run synthetic rules adapter tests
        run: node tools/validate_rules_adapters.mjs
      - name: Run frontend integration tests
        run: node tools/validate_server_frontend.mjs
      - name: Run class-loading regression tests
        run: node tools/validate_class_loading.mjs
      - name: Run theme tests
        run: node tools/validate_theme.mjs
      - name: Verify portable rules harness without private rule data
        run: node tools/validate_rules.mjs --self-test

  browser:
    name: Synthetic mobile browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated development dependencies
        run: npm ci --prefix tools/browser
      - name: Install Chromium and WebKit
        run: npx --prefix tools/browser playwright install --with-deps chromium webkit
      - name: Test synthetic mobile library and sheet
        run: node tools/browser/mobile.mjs
